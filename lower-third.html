<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* MAIN LOWER THIRD */
.lower-third {
    position: absolute;
    left: 45px;
    right: 45px;
    bottom: 35px;
    height: 155px;

    display: flex;
    align-items: stretch;

    background: linear-gradient(
        110deg,
        rgba(4, 65, 45, 0.97) 0%,
        rgba(7, 100, 69, 0.95) 55%,
        rgba(12, 125, 85, 0.92) 100%
    );

    border-radius: 12px;
    overflow: hidden;

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
}

/* LEFT DECORATIVE BLOCK */
.accent {
    width: 18px;
    height: 100%;

    background: linear-gradient(
        180deg,
        #7ee2b8,
        #28b67a
    );

    margin-right: 0;
}

/* STUDENT INFORMATION */
.student-info {
    flex: 1;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 20px 40px;
}

/* STUDENT NAME */
.name {
    color: #ffffff;

    font-size: 40px;
    font-weight: 700;

    letter-spacing: 0.5px;
    line-height: 1.05;
}

/* PROGRAMME */
.programme {
    color: rgba(255,255,255,0.92);

    font-size: 24px;
    font-weight: 400;

    margin-top: 10px;
}

/* FACULTY */
.faculty {
    color: #9ff0ce;

    font-size: 19px;
    font-weight: 600;

    margin-top: 5px;

    text-transform: uppercase;
    letter-spacing: 1.4px;
}

/* SMALL DECORATIVE LINE */
.student-info::after {
    content: "";

    position: absolute;

    right: 40px;
    top: 30px;

    width: 100px;
    height: 3px;

    background: rgba(255,255,255,0.25);
}
</style>
</head>

<body>

<div class="lower-third">

    <div class="accent"></div>

    <div class="student-info">

        <div class="name">
            IZRULFIZAL SAUFIHAMIZAL BIN IBRAHIM
        </div>

        <div class="programme">
            Bachelor of Computer Science (Software Engineering) (Hons)
        </div>

        <div class="faculty">
            Faculty of Robotics and Data Science
        </div>

    </div>

</div>

</body>
</html>
